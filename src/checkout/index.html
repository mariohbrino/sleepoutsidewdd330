<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header id="header" class="divider"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>

        <form id="checkout_form" class="checkout-form" method="POST">
          <fieldset>
            <legend>Shipping</legend>

            <label for="firstname">First Name</label>
            <input id="firstname" type="text" name="firstname" required />

            <label for="lastname">Last Name</label>
            <input id="lastname" type="text" name="lastname" required />

            <label for="street_address">Street Address</label>
            <input
              id="street_address"
              type="text"
              name="street_address"
              required
            />

            <label for="city">City</label>
            <input id="city" type="text" name="city" required />

            <label for="state">State</label>
            <input id="state" type="text" name="state" required />

            <label for="zip_code">Zip Code</label>
            <input id="zip_code" type="text" name="zip_code" required />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="credit_cardnumber">Credit Card Number</label>
            <input
              id="credit_cardnumber"
              type="text"
              name="credit_cardnumber"
              required
              value="1234123412341234"
            />

            <label for="expiration_date">Expiration Date</label>
            <input
              id="expiration_date"
              type="month"
              name="expiration_date"
              required
              value="2030-02"
            />

            <label for="security_code">Security Code</label>
            <input
              id="security_code"
              type="text"
              name="security_code"
              required
              value="123"
            />
          </fieldset>

          <button id="checkout_order" class="checkout-link">Checkout</button>
        </form>
      </section>

      <div id="checkout_summary" class="checkout-summary">
        <div class="checkout-summary-information">
          <p>Subtotal: <strong id="subtotal-value">$0.00</strong></p>
          <p>Tax: <strong id="tax">$0.00</strong></p>
          <p>
            Shipping Estimate: <strong id="shipping-estimate">$0.00</strong>
          </p>
          <p>Order Total: <strong id="order-total">$0.00</strong></p>
        </div>
      </div>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
